name: lending-api-junit-generator

# ──────────────────────────────────────────────────────────────────────────────
# Sequential JUnit generator workflow
#
# For each *.xlsx / *.xls file under REQ_DIR that does NOT carry the "done_"
# prefix, this workflow:
#   1. Creates a feature branch  develop/<slug>
#   2. Opens a GitHub issue assigned to the Copilot agent
#      (.github/agents/lending-api-junit-generator.agent.md)
#   3. Polls the feature branch until the agent pushes the renamed
#      "done_<filename>" — confirming it finished successfully
#   4. Raises a Pull Request  develop/<slug>  →  master
#   5. Moves on to the next file
#
# The loop exits when no more unprocessed files remain.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  REQ_DIR: IntegrationAPITool/artifacts/requirement_doc
  BASE_BRANCH: main
  # How long (seconds) to wait between each poll attempt
  POLL_INTERVAL_SEC: "60"
  # Maximum number of poll attempts before giving up on a file (~60 min per file)
  POLL_MAX_ATTEMPTS: "60"

jobs:
  process-spreadsheets:
    name: Invoke Copilot agent for each unprocessed spreadsheet
    runs-on: ubuntu-latest
    timeout-minutes: 360   # hard cap: 6 h total

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CODESPACES_PAT }}

      # ── 2. Git identity (needed if the runner ever needs to push) ────────────
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 3. Labels (idempotent) ───────────────────────────────────────────────
      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        run: |
          for LABEL in "junit-generated" "automation"; do
            gh label create "${LABEL}" \
              --color "0075ca" \
              --description "Auto-generated by lending-api-junit-generator" \
              2>/dev/null || true
          done

      # ── 4. Main sequential loop ──────────────────────────────────────────────
      - name: Process spreadsheets one at a time
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |

          # Guard: requirements folder must exist
          if [ ! -d "${REQ_DIR}" ]; then
            echo "::warning::Requirements folder not found: ${REQ_DIR} — nothing to process."
            exit 0
          fi

          # ════════════════════════════════════════════════════════════════════
          # MAIN LOOP — pick one unprocessed file per iteration
          # ════════════════════════════════════════════════════════════════════
          while true; do

            # Return to the base branch and get the latest state before scanning
            git checkout "${BASE_BRANCH}"
            git pull origin "${BASE_BRANCH}" --rebase --quiet

            # Pick the first spreadsheet that does NOT start with "done_"
            NEXT_FILE=$(find "${REQ_DIR}" \
              -maxdepth 1 \
              \( -name "*.xlsx" -o -name "*.xls" \) \
              ! -name "done_*" \
              | sort \
              | head -1)

            if [ -z "${NEXT_FILE}" ]; then
              echo "No unprocessed spreadsheets remain in ${REQ_DIR}."
              echo "All done — exiting workflow."
              break
            fi

            FILENAME=$(basename "${NEXT_FILE}")
            NAME_NO_EXT="${FILENAME%.*}"

            # ── Derive entity name (PascalCase, strip trailing "v1.2" version) ──
            ENTITY_NAME=$(echo "${NAME_NO_EXT}" \
              | sed -E 's/[[:space:]]+v[0-9]+(\.[0-9]+)*[[:space:]]*$//' \
              | sed 's/[^[:alnum:]]/ /g' \
              | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1' \
              | tr -d ' ')

            # ── Derive branch slug (lowercase kebab) ─────────────────────────
            BRANCH_SLUG=$(echo "${NAME_NO_EXT}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9]/-/g' \
              | tr -s '-' \
              | sed 's/^-//;s/-$//')
            BRANCH_NAME="develop/${BRANCH_SLUG}"

            echo ""
            echo "══════════════════════════════════════════════════════════"
            echo " Spreadsheet : ${FILENAME}"
            echo " Entity      : ${ENTITY_NAME}"
            echo " Branch      : ${BRANCH_NAME}"
            echo "══════════════════════════════════════════════════════════"

            # ── Create feature branch if it does not exist ───────────────────
            if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null 2>&1; then
              echo "Branch '${BRANCH_NAME}' already exists — reusing it."
            else
              git checkout -b "${BRANCH_NAME}"
              git push origin "${BRANCH_NAME}"
              echo "Branch '${BRANCH_NAME}' created and pushed."
            fi

            # Return to base branch for a clean state
            git checkout "${BASE_BRANCH}"

            # ── Build and write the Copilot issue body to a temp file ────────
            DONE_PATH="${REQ_DIR}/done_${FILENAME}"
            BODY_FILE=$(mktemp /tmp/issue_XXXXXX.md)

            printf '%s\n' \
              "## JUnit Test Generation Task" \
              "" \
              "**Trigger**: Workflow \`lending-api-junit-generator\` — run [\`${GH_RUN_ID}\`](${GH_SERVER_URL}/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID})" \
              "" \
              "---" \
              "" \
              "### Instructions for Copilot" \
              "" \
              "Invoke the \`.github/agents/lending-api-junit-generator.agent.md\` agent with the input below." \
              "" \
              "\`\`\`" \
              "Spreadsheet path: ${NEXT_FILE}" \
              "\`\`\`" \
              "" \
              "The agent must:" \
              "1. Detect all worksheets in the spreadsheet (Create / Update / GetByID / Delete)." \
              "2. Invoke the corresponding JUnit generator skills for each detected sheet." \
              "3. **Rename** the spreadsheet to \`done_${FILENAME}\` (underscore prefix) once all skills complete successfully." \
              "4. Commit all generated test classes **and** the renamed spreadsheet." \
              "5. Push the commit to branch \`${BRANCH_NAME}\`." \
              "" \
              "> ⚠️ Do **not** raise a PR — the workflow will do that automatically after detecting the rename." \
              "" \
              "---" \
              "" \
              "### Context" \
              "" \
              "| Field | Value |" \
              "|---|---|" \
              "| Spreadsheet | \`${NEXT_FILE}\` |" \
              "| Rename to | \`${DONE_PATH}\` |" \
              "| Target branch | \`${BRANCH_NAME}\` |" \
              "| Base branch | \`${BASE_BRANCH}\` |" \
              "| Entity | \`${ENTITY_NAME}\` |" \
              > "${BODY_FILE}"

            # ── Create GitHub issue and assign it to the Copilot agent ───────
            ISSUE_TITLE="[JUnit Generator] Generate integration tests for ${ENTITY_NAME} API"

            ISSUE_URL=$(gh issue create \
              --title    "${ISSUE_TITLE}" \
              --body-file "${BODY_FILE}" \
              --assignee "copilot" \
              --label    "junit-generated" \
              --label    "automation")
            rm -f "${BODY_FILE}"

            ISSUE_NUMBER=$(basename "${ISSUE_URL}")
            echo "Copilot issue created: ${ISSUE_URL}"

            # ── Poll the feature branch until agent pushes done_<filename> ───
            ATTEMPTS=0
            SUCCESS=false
            MAX_MIN=$(( POLL_MAX_ATTEMPTS * POLL_INTERVAL_SEC / 60 ))

            echo "Polling branch '${BRANCH_NAME}' for 'done_${FILENAME}' ..."
            echo "(max ${POLL_MAX_ATTEMPTS} attempts × ${POLL_INTERVAL_SEC}s ≈ ${MAX_MIN} min)"

            while [ "${ATTEMPTS}" -lt "${POLL_MAX_ATTEMPTS}" ]; do
              git fetch origin "${BRANCH_NAME}" --quiet 2>/dev/null || true

              # Check if the renamed file exists in the remote branch tree
              if git ls-tree -r "origin/${BRANCH_NAME}" --name-only 2>/dev/null \
                  | grep -qF "done_${FILENAME}"; then
                echo "::notice::✓ Agent completed — 'done_${FILENAME}' detected in branch '${BRANCH_NAME}'."
                SUCCESS=true
                break
              fi

              ATTEMPTS=$(( ATTEMPTS + 1 ))
              echo "[${ATTEMPTS}/${POLL_MAX_ATTEMPTS}] Not ready yet. Retrying in ${POLL_INTERVAL_SEC}s ..."
              sleep "${POLL_INTERVAL_SEC}"
            done

            # ── Handle timeout ────────────────────────────────────────────────
            if [ "${SUCCESS}" != "true" ]; then
              echo "::error::Timed out waiting for agent to process '${FILENAME}'. Skipping PR and moving to next file."
              gh issue comment "${ISSUE_NUMBER}" \
                --body "⚠️ Workflow timed out waiting for this task. Please close this issue and re-trigger the workflow, or process the file manually." \
                2>/dev/null || true
              continue
            fi

            # ── Raise PR (idempotent — skip if one already exists) ───────────
            EXISTING_PR=$(gh pr list \
              --head  "${BRANCH_NAME}" \
              --base  "${BASE_BRANCH}" \
              --state open \
              --json  number \
              --jq    '.[0].number' 2>/dev/null || echo "")

            if [ -z "${EXISTING_PR}" ]; then
              PR_URL=$(gh pr create \
                --head  "${BRANCH_NAME}" \
                --base  "${BASE_BRANCH}" \
                --title "[JUnit] Generated integration tests for ${ENTITY_NAME} API" \
                --body  "Auto-generated by the \`lending-api-junit-generator\` workflow. Resolves #${ISSUE_NUMBER}" \
                --label "junit-generated" \
                --label "automation")
              echo "::notice::PR created: ${PR_URL}"
            else
              echo "PR already open for '${BRANCH_NAME}' (#${EXISTING_PR}) — skipping creation."
            fi

          done
          # ════════════════════════════════════════════════════════════════════
          # END LOOP
          # ════════════════════════════════════════════════════════════════════

          echo ""
          echo "lending-api-junit-generator workflow finished."
