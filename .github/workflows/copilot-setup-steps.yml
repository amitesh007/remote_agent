name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            liqweb-mcp-server-jira-1.4.0.tgz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local MCP servers (jira, figma)
        run: npm install -g ./liqweb-mcp-server-jira-1.4.0.tgz figma-developer-mcp@0.13.2 && command -v mcp-server-jira && command -v figma-developer-mcp
