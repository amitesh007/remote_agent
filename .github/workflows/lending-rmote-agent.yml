name: LENDING API JUNIT GENERATOR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Directory that contains the requirement Excel files
  REQ_DIR: IntegrationAPITool/artifacts/requirement_doc

jobs:
  process-spreadsheets:
    name: Process requirement spreadsheets and generate JUnit tests
    runs-on: ubuntu-latest
    env:
      # Required by the 'gh' CLI for all GitHub API calls (PR creation, etc.)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── Checkout with full history so branch creation works correctly ────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detect the repository's actual default branch (e.g. master, main) via the
      # GitHub API and export it as DEFAULT_BRANCH for all subsequent steps.
      - name: Detect default branch
        run: |
          DEFAULT_BRANCH=$(gh repo view "${GITHUB_REPOSITORY}" --json defaultBranchRef --jq '.defaultBranchRef.name')
          echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}" >> "${GITHUB_ENV}"
          echo "Default branch detected: ${DEFAULT_BRANCH}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install the 'xlsx' library used by every Node.js script in this workflow
      - name: Install Node.js dependencies
        run: npm install xlsx

      # Generate a timestamped feature branch name using Node.js and export it
      # to GITHUB_ENV so every subsequent step in this job can reference it
      # as the ${FEATURE_BRANCH} environment variable.
      # Format: develop/junits_YYYYMMDD_HHmmss  (UTC)
      - name: Generate timestamped feature branch name
        run: |
          node -e "
            const now  = new Date();
            const pad  = n => String(n).padStart(2, '0');
            const ts   = now.getUTCFullYear().toString()
                       + pad(now.getUTCMonth() + 1)
                       + pad(now.getUTCDate())
                       + '_'
                       + pad(now.getUTCHours())
                       + pad(now.getUTCMinutes())
                       + pad(now.getUTCSeconds());
            const branch = 'develop/junits_' + ts;
            // Write to GITHUB_ENV so the variable is available in all later steps
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'FEATURE_BRANCH=' + branch + '\n');
            console.log('Feature branch set to: ' + branch);
          "

      # ── STEPS 1-3 ────────────────────────────────────────────────────────────
      # Scan REQ_DIR for .xlsx files that do NOT carry a 'done_' prefix.
      # For each qualifying file, check for Create / Update / GetByID / Delete
      # worksheets. Read ENTITY_NAME (A2) and its value (B2) from the first
      # qualifying sheet found — both values are the same across all sheets
      # in an Excel file since they describe the same entity.
      # One record per file is stored: { filePath, entityName, entityValue }
      # ─────────────────────────────────────────────────────────────────────────
      - name: Read Excel files and extract entities
        run: |
          cat > extract_entities.mjs << 'SCRIPT_EOF'
          import { readFileSync, readdirSync, writeFileSync } from 'fs';
          import { join, basename } from 'path';
          import XLSX from 'xlsx';

          const reqDir = process.env.REQ_DIR;

          // Target sheet names (lowercase, no spaces) that trigger processing.
          const TARGET_SHEETS = new Set(['create', 'update', 'getbyid', 'delete']);

          // STEP 1: List all .xlsx files in the requirement_doc directory.
          // STEP 2: Exclude any file already prefixed with 'done_'.
          const files = readdirSync(reqDir)
            .filter(name => name.endsWith('.xlsx') && !name.startsWith('done_'))
            .map(name => join(reqDir, name));

          if (files.length === 0) {
            console.log('No unprocessed spreadsheets found — nothing to do.');
            writeFileSync('/tmp/entities.json', JSON.stringify([]));
            process.exit(0);
          }

          console.log(`Found ${files.length} unprocessed spreadsheet(s):`);
          files.forEach(f => console.log(`  ${basename(f)}`));

          const results = [];

          // STEP 3: For each file, find the first qualifying target sheet and
          //         read ENTITY_NAME from A2 and its value from B2.
          //         One record is stored per file — both values are the same
          //         across all sheets because they describe the same entity.
          for (const filePath of files) {
            const workbook = XLSX.read(readFileSync(filePath), { type: 'buffer' });
            console.log(`\nFile: ${basename(filePath)}`);

            let entityName  = '';
            let entityValue = '';

            for (const sheetName of workbook.SheetNames) {
              const sheetKey = sheetName.trim().toLowerCase().replace(/\s+/g, '');
              if (!TARGET_SHEETS.has(sheetKey)) continue; // skip non-target sheets

              // Parse sheet as raw row arrays so column indices are explicit.
              const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
                header: 1,
                defval: '',
              });

              // Row index 1 = spreadsheet row 2 (A2 / B2).
              if (rows.length < 2) {
                console.log(`  Skipping sheet '${sheetName}' — no data in row 2`);
                continue;
              }

              const dataRow = rows[1];
              entityName  = String(dataRow[0] ?? '').trim(); // Column A — A2
              entityValue = String(dataRow[1] ?? '').trim(); // Column B — B2

              if (entityName && entityValue) {
                console.log(`  Read from sheet '${sheetName}': A2='${entityName}' B2='${entityValue}'`);
                break; // one qualifying sheet is enough — all sheets share the same entity
              }
            }

            if (!entityValue) {
              console.log(`  WARNING: No entity value found in B2 for ${basename(filePath)} — skipping`);
              continue;
            }

            // Store ONE record per file.
            results.push({ filePath, entityName, entityValue });
            console.log(`  -> entityValue (B2): '${entityValue}'  |  filePath: ${filePath}`);
          }

          writeFileSync('/tmp/entities.json', JSON.stringify(results, null, 2));
          console.log(`\nTotal files queued: ${results.length}`);
          SCRIPT_EOF

          node extract_entities.mjs

      # ── STEP 4 ───────────────────────────────────────────────────────────────
      # Create the timestamped 'develop/junits_<timestamp>' feature branch from
      # the default branch. If the branch already exists on the remote,
      # check it out instead. All generated JUnit classes and renamed spreadsheets
      # land on this single branch for the entire workflow run.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Create or checkout timestamped develop/junits feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if develop/junits already exists on the remote
          if git ls-remote --exit-code origin "${FEATURE_BRANCH}" > /dev/null 2>&1; then
            # Branch exists — fetch it and switch to it
            git fetch origin "${FEATURE_BRANCH}"
            git checkout "${FEATURE_BRANCH}"
            echo "Checked out existing branch: ${FEATURE_BRANCH}"
          else
            # Branch does not exist — create it from current HEAD (${DEFAULT_BRANCH})
            git checkout -b "${FEATURE_BRANCH}"
            git push -u origin "${FEATURE_BRANCH}"
            echo "Created new branch: ${FEATURE_BRANCH}"
          fi

      # ── STEPS 5-7 ────────────────────────────────────────────────────────────
      # For each Excel file (processed sequentially):
      #   STEP 5 — Build one skill-specific prompt per worksheet
      #            (Create / Update / GetByID / Delete) and create a GitHub issue
      #            whose body contains all prompts for that file. Assign the issue
      #            to the GitHub Copilot coding agent, which reads the issue,
      #            invokes `.github/agents/lending-api-junit-generator.agent.md`,
      #            generates the JUnit classes on the feature branch, and
      #            renames the spreadsheet with a `done_` prefix.
      #   STEP 6 — Poll the remote feature branch until the `done_` prefixed file
      #            appears in a commit made by the agent. Only the agent is
      #            responsible for the rename — the workflow only detects it.
      #   STEP 7 — Once detected, close the tracking issue and move to the next
      #            Excel file. Fail the workflow on timeout.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Invoke Copilot agent per file and wait for done_ rename
        run: |
          # ── PART 1: Node.js — prepare one GitHub issue body per Excel file ──────────
          # Each issue contains a SINGLE prompt: entity value (B2) + file path.
          # The agent reads the issue, invokes the lending-api-junit-generator agent
          # for all available worksheets (Create/Update/GetByID/Delete), generates
          # the JUnit classes, and renames the file with the done_ prefix.
          cat > prepare_agent_invocations.mjs << 'SCRIPT_EOF'
          import { readFileSync, writeFileSync, mkdirSync, appendFileSync } from 'fs';
          import { basename } from 'path';

          const entities = JSON.parse(readFileSync('/tmp/entities.json', 'utf8'));

          if (entities.length === 0) {
            console.log('No entities to process.');
            writeFileSync('/tmp/files_to_process.txt', '');
            process.exit(0);
          }

          mkdirSync('/tmp/agent_issues', { recursive: true });
          const summaryPath  = process.env.GITHUB_STEP_SUMMARY;
          const featureBranch = process.env.FEATURE_BRANCH;
          const fileList = [];

          // One record per file — build one issue and one prompt per file.
          for (const { filePath, entityName, entityValue } of entities) {
            const filename = basename(filePath);

            // Single prompt: entity value (B2) + spreadsheet path.
            // The agent determines which skills to invoke (Create/Update/GetByID/Delete)
            // based on which worksheets are present in the Excel file.
            const issueBodyLines = [
              'Invoke `.github/agents/lending-api-junit-generator.agent.md`',
              '',
              `Generate JUnit 5 integration tests for **${filename}** on branch \`${featureBranch}\`.`,
              '',
              `**Entity name**: \`${entityValue}\``,
              `**Specification spreadsheet**: \`${filePath}\``,
              '',
              'The agent must:',
              '1. Open the spreadsheet and detect which of the four worksheets',
              '   (Create, Update, GetByID, Delete) are present.',
              '2. For each present worksheet, invoke the corresponding skill',
              '   and generate the JUnit integration test class.',
              '3. Once JUnit classes for ALL available worksheets have been',
              `   generated and committed to branch \`${featureBranch}\`, rename`,
              `   the spreadsheet **${filename}** by prepending \`done_\` to its`,
              `   filename and commit the change to branch \`${featureBranch}\`.`,
            ];

            const issueFile = `/tmp/agent_issues/${filename}.txt`;
            writeFileSync(issueFile, issueBodyLines.join('\n'));
            fileList.push(`${filePath}|${issueFile}`);

            console.log(`Prepared agent invocation for: ${filename}`);
            console.log(`  Entity value (B2): '${entityValue}'`);
            console.log(`  File path        : ${filePath}`);

            // Write to step summary for visibility.
            if (summaryPath) {
              appendFileSync(summaryPath,
                `## ${filename}\n` +
                `| Field | Value |\n|---|---|\n` +
                `| **Entity Name (A2)** | \`${entityName}\` |\n` +
                `| **Entity Value (B2)** | \`${entityValue}\` |\n` +
                `| **Spreadsheet Path** | \`${filePath}\` |\n` +
                `| **Feature Branch** | \`${featureBranch}\` |\n\n`
              );
            }
          }

          writeFileSync('/tmp/files_to_process.txt', fileList.join('\n'));
          console.log(`\nTotal files queued for agent: ${fileList.length}`);
          SCRIPT_EOF

          node prepare_agent_invocations.mjs

          # Exit early if there is nothing to process
          if [ ! -s /tmp/files_to_process.txt ]; then
            echo "No files to process — skipping agent invocation."
            exit 0
          fi

          # ── PART 2: Bash — invoke Copilot agent and poll per file ──────────────────
          # For each Excel file:
          #   a) Create a GitHub issue containing all worksheet prompts.
          #   b) Assign the issue to GitHub Copilot — this triggers the coding
          #      agent which reads .github/agents/lending-api-junit-generator.agent.md
          #      and generates the JUnit classes on the feature branch.
          #   c) Poll the remote feature branch until the agent renames the
          #      spreadsheet with the done_ prefix (committed by the agent).
          #   d) Only then advance to the next Excel file.

          MAX_WAIT=3600     # maximum seconds to wait per file (60 minutes)
          POLL_INTERVAL=30  # seconds between each poll

          while IFS='|' read -r FILE_PATH ISSUE_FILE; do
            [ -z "${FILE_PATH}" ] && continue

            FILENAME=$(basename "${FILE_PATH}")
            DONE_FILENAME="done_${FILENAME}"
            # Path as it would appear in git ls-tree output
            DONE_CHECK_PATH="$(dirname ${FILE_PATH})/${DONE_FILENAME}"

            echo ""
            echo "==========================================================="
            echo "Invoking Copilot agent for: ${FILENAME}"
            echo "==========================================================="

            # Create the GitHub issue. The issue body references the custom agent
            # and contains the entity value + spreadsheet path.
            #
            # IMPORTANT: Assigning an issue to 'copilot' requires a personal access
            # token (PAT) with repo scope. The built-in GITHUB_TOKEN (an app
            # installation token) is rejected by GitHub for this operation.
            #
            # Store your PAT in the repository secret COPILOT_PAT.
            # Without this secret the Copilot agent will NOT be triggered and the
            # workflow will stall waiting for a done_ rename that never comes.
            # We therefore fail fast here rather than creating a useless issue.
            if [ -z "${{ secrets.COPILOT_PAT }}" ]; then
              echo "::error::COPILOT_PAT secret is not set. The Copilot coding agent"
              echo "::error::cannot be assigned to an issue without a personal access token."
              echo "::error::Add a PAT with 'repo' scope as the COPILOT_PAT repository secret and re-run."
              exit 1
            fi

            ISSUE_URL=$(GH_TOKEN="${{ secrets.COPILOT_PAT }}" gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Generate JUnit tests: ${FILENAME%.xlsx}" \
              --body-file "${ISSUE_FILE}" \
              --assignee "copilot")
            ISSUE_NUMBER="${ISSUE_URL##*/}"

            echo "  Created issue #${ISSUE_NUMBER} — assigned to GitHub Copilot"
            echo "  https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}"

            # ── STEP 6: Poll the remote feature branch for the done_ rename ──────
            # The agent is responsible for renaming the file and committing it.
            # The workflow waits passively until it detects the done_ file in
            # the remote branch tree — it never renames the file itself.
            ELAPSED=0
            AGENT_DONE=false

            echo "  Waiting for agent to commit '${DONE_FILENAME}' on '${FEATURE_BRANCH}'..."

            while [ "${ELAPSED}" -lt "${MAX_WAIT}" ]; do

              # Fetch the latest remote state of the feature branch
              git fetch origin "${FEATURE_BRANCH}" --quiet 2>/dev/null || true

              # Check for done_ file in the remote branch tree (no checkout needed)
              if git ls-tree -r "origin/${FEATURE_BRANCH}" --name-only 2>/dev/null \
                  | grep -qF "${DONE_CHECK_PATH}"; then
                echo "  Agent completed: '${DONE_FILENAME}' found on ${FEATURE_BRANCH}"
                AGENT_DONE=true
                break
              fi

              # Secondary signal: if the issue was closed the agent finished
              ISSUE_STATE=$(gh issue view "${ISSUE_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json state --jq '.state' 2>/dev/null || echo "OPEN")

              if [ "${ISSUE_STATE}" = "CLOSED" ]; then
                echo "  Issue #${ISSUE_NUMBER} closed — agent completed."
                AGENT_DONE=true
                break
              fi

              echo "  Still waiting... ${ELAPSED}s elapsed (issue state: ${ISSUE_STATE})"
              sleep "${POLL_INTERVAL}"
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done

            # Fail the workflow if the agent did not complete in time
            if [ "${AGENT_DONE}" = "false" ]; then
              echo "  ERROR: Agent timed out after ${MAX_WAIT}s for ${FILENAME}"
              gh issue close "${ISSUE_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "Workflow timed out waiting for JUnit generation." \
                2>/dev/null || true
              exit 1
            fi

            # Close the tracking issue (no-op if already closed by the agent)
            gh issue close "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              2>/dev/null || true
            echo "  Closed issue #${ISSUE_NUMBER}"

            # ── STEP 7: Sync local checkout and advance to the next file ──────────
            # Pull the agent's commits (generated classes + done_ rename) so
            # subsequent steps see the full up-to-date branch state.
            git fetch origin "${FEATURE_BRANCH}" --quiet
            git merge --ff-only "origin/${FEATURE_BRANCH}" 2>/dev/null || \
              git reset --hard "origin/${FEATURE_BRANCH}"
            echo "  Local branch synced. Proceeding to next file."

          done < /tmp/files_to_process.txt

      # ── STEP 8 ───────────────────────────────────────────────────────────────
      # Once all Excel files have been renamed to 'done_', raise a single PR
      # from the develop/junits_<timestamp> branch targeting the default branch.
      # If any unprocessed files remain the step warns and skips PR creation.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Create Pull Request from develop/junits_<timestamp> to default branch
        run: |
          # Safety check: ensure no unprocessed spreadsheets remain
          REMAINING=$(find "${REQ_DIR}" -maxdepth 1 -type f -name "*.xlsx" ! -name "done_*" | wc -l)
          if [ "${REMAINING}" -gt 0 ]; then
            echo "WARNING: ${REMAINING} unprocessed spreadsheet(s) still present — skipping PR creation."
            exit 0
          fi

          # Build the PR description body
          {
            echo "## Automated JUnit Generation"
            echo ""
            echo "This PR was raised automatically after all requirement spreadsheets"
            echo "in \`${REQ_DIR}\` were processed by the \`lending-api-junit-generator\` agent."
            echo ""
            echo "### What changed"
            echo "- Requirement spreadsheets renamed with \`done_\` prefix"
            echo "- JUnit 5 integration test classes generated for each entity"
            echo ""
            echo "---"
            echo "*Generated by the Process Requirement Spreadsheets workflow — run \`${{ github.run_id }}\`*"
          } > /tmp/pr_body.txt

          # Create the PR; if one already exists the command exits non-zero —
          # suppress that so the workflow step does not fail
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${FEATURE_BRANCH}" \
            --title "feat: JUnit integration tests from requirement spreadsheets" \
            --body-file /tmp/pr_body.txt \
            --label "auto-generated,junit,integration-tests" \
            || echo "PR already exists or could not be created — continuing."
