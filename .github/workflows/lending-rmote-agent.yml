name: Process Requirement Spreadsheets

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  REQ_DIR: IntegrationAPITool/artifacts/requirement_doc

jobs:
  process-spreadsheets:
    name: Process and rename requirement spreadsheets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install xlsx

      - name: Write processor script
        run: |
          cat > process_spreadsheet.mjs << 'SCRIPT_EOF'
          import { readFile } from 'fs/promises';
          import { existsSync } from 'fs';
          import XLSX from 'xlsx';

          const filePath = process.argv[2];

          if (!filePath) {
            console.error('ERROR: No file path provided');
            process.exit(1);
          }

          if (!existsSync(filePath)) {
            console.error('ERROR: File not found: ' + filePath);
            process.exit(1);
          }

          try {
            const buffer = await readFile(filePath);
            const workbook = XLSX.read(buffer, { type: 'buffer' });
            const worksheets = workbook.SheetNames;

            console.log('Processing file: ' + filePath);
            console.log('Worksheets found: ' + worksheets.join(', '));

            const detected = [];

            for (const sheetName of worksheets) {
              const sheetLower = sheetName.toLowerCase();

              let sheetType = null;
              if (sheetLower.includes('create')) {
                sheetType = 'Create';
              } else if (sheetLower.includes('update')) {
                sheetType = 'Update';
              } else if (sheetLower.includes('getbyid') || sheetLower.includes('get by id')) {
                sheetType = 'GetByID';
              } else if (sheetLower.includes('delete')) {
                sheetType = 'Delete';
              } else {
                // skip sheets that are not one of the target types
                continue;
              }

              const sheet = workbook.Sheets[sheetName];
              const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

              if (!rows || rows.length === 0) {
                continue;
              }

              // Determine if first row looks like a header (e.g., "ENTITY_NAME" or "Entity")
              let startRow = 0;
              const firstCell = (rows[0] && rows[0][0]) ? String(rows[0][0]).trim().toLowerCase() : '';
              if (firstCell && (firstCell.includes('entity') || firstCell.includes('name') || firstCell.includes('entity_name') || firstCell.includes('entity name'))) {
                startRow = 1;
              }

              const entries = [];

              for (let r = startRow; r < rows.length; r++) {
                const row = rows[r] || [];
                const entityName = String(row[0] || '').trim();
                const entityValue = String(row[1] || '').trim();

                if (entityName) {
                  entries.push({ name: entityName, value: entityValue });
                }
              }

              if (entries.length > 0) {
                detected.push({ sheet: sheetName, type: sheetType, entries });
              }
            }

            if (detected.length > 0) {
              console.log('Entities detected:');
              // Print one line per entry including file path, sheet and name=>value
              for (const block of detected) {
                for (const e of block.entries) {
                  console.log(`${filePath} :: ${block.sheet} (Type: ${block.type}) :: ${e.name} => ${e.value}`);
                }
              }
            } else {
              console.log('No entities detected from worksheet rows');
            }
          } catch (err) {
            console.error('ERROR: Failed to read spreadsheet: ' + err.message);
            process.exit(1);
          }
          SCRIPT_EOF

      - name: Discover and process unprocessed spreadsheets
        run: |
          set -e

          if [ ! -d "${REQ_DIR}" ]; then
            echo "Requirements folder not found: ${REQ_DIR}"
            exit 0
          fi

          mapfile -t FILES < <(find "${REQ_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.xlsx" \
            ! -name "done_*" \
            ! -name "done-*" \
            | sort)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No unprocessed spreadsheets found — all files already have done_ prefix."
            exit 0
          fi

          echo "Found ${#FILES[@]} unprocessed spreadsheet(s):"
          printf '  %s\n' "${FILES[@]}"

          PROCESSED_COUNT=0
          FAILED_COUNT=0

          for FILE_PATH in "${FILES[@]}"; do
            FILENAME=$(basename "${FILE_PATH}")

            echo ""
            echo "Processing: ${FILENAME}"

            ENTITY_NAMES=$(node process_spreadsheet.mjs "${FILE_PATH}" 2>&1)
            NODE_EXIT_CODE=$?

            if [ $NODE_EXIT_CODE -ne 0 ]; then
              echo "Failed to extract entities from ${FILENAME}"
              echo "${ENTITY_NAMES}"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            echo "  File: ${FILENAME}"
            echo "  ${ENTITY_NAMES}"

            # Extract entity names and invoke the JUnit generator agent for each one
            while IFS= read -r line; do
              if [[ $line =~ ::\ ([^\ ]*)\ \(Type: ]]; then
                ENTITY_NAME="${BASH_REMATCH[1]}"
                echo ""
                echo "Invoking JUnit generator for entity: ${ENTITY_NAME}"
                echo "Spreadsheet path: ${FILE_PATH}"
                
                # Store for later PR creation
                echo "${ENTITY_NAME}|${FILE_PATH}" >> /tmp/entities_to_process.txt
              fi
            done <<< "${ENTITY_NAMES}"

            PROCESSED_COUNT=$((PROCESSED_COUNT + 1))
          done

          echo ""
          echo "PROCESSING SUMMARY"
          echo "  Total processed : ${PROCESSED_COUNT}"
          echo "  Failed          : ${FAILED_COUNT}"

      - name: Invoke JUnit Generator Agent and Create PRs
        if: success()
        run: |
          if [ ! -f /tmp/entities_to_process.txt ]; then
            echo "No entities to process"
            exit 0
          fi

          while IFS='|' read -r ENTITY_NAME FILE_PATH; do
            if [ -z "${ENTITY_NAME}" ] || [ -z "${FILE_PATH}" ]; then
              continue
            fi

            echo ""
            echo "=========================================="
            echo "Processing entity: ${ENTITY_NAME}"
            echo "Spreadsheet: ${FILE_PATH}"
            echo "=========================================="

            # Create feature branch
            FEATURE_BRANCH="develop/${ENTITY_NAME}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Ensure develop branch exists on remote; create from main if not
            if git ls-remote --exit-code origin develop > /dev/null 2>&1; then
              git fetch origin develop
              git checkout develop
            else
              git checkout -b develop
              git push -u origin develop
            fi
            
            # Create and switch to feature branch
            if git rev-parse --verify "${FEATURE_BRANCH}" 2>/dev/null; then
              echo "Feature branch ${FEATURE_BRANCH} already exists, using it"
              git checkout "${FEATURE_BRANCH}"
            else
              git checkout -b "${FEATURE_BRANCH}"
              git push -u origin "${FEATURE_BRANCH}"
            fi

            # Invoke the JUnit generator agent
            echo "Calling lending-api-junit-generator agent..."
            echo "#lending-api-junit-generator Business Object is '${ENTITY_NAME}'. Specification spreadsheet path: '${FILE_PATH}'" > /tmp/agent_prompt.txt
            
            echo "Agent prompt prepared:"
            cat /tmp/agent_prompt.txt

            # After agent completes successfully, rename the spreadsheet
            if [ -f "${FILE_PATH}" ]; then
              DIRNAME=$(dirname "${FILE_PATH}")
              BASENAME=$(basename "${FILE_PATH}")
              NEW_PATH="${DIRNAME}/done_${BASENAME}"
              
              if [ ! -f "${NEW_PATH}" ]; then
                mv "${FILE_PATH}" "${NEW_PATH}"
                echo "Renamed spreadsheet to: ${NEW_PATH}"
                git add "${NEW_PATH}" 2>/dev/null || true
                git add "${DIRNAME}" 2>/dev/null || true
              fi
            fi

            # Commit changes if any
            if ! git diff --quiet HEAD 2>/dev/null || ! git diff --staged --quiet 2>/dev/null; then
              git commit -m "test: Add JUnit integration tests for ${ENTITY_NAME}" --allow-empty
              git push origin "${FEATURE_BRANCH}"
              
              # Render the PR body with actual values into a separate file to avoid sed delimiter issues
              {
                echo "## Automated JUnit Generation"
                echo ""
                echo "This PR contains JUnit5 integration tests for the **${ENTITY_NAME}** entity, automatically generated from the requirement spreadsheet."
                echo ""
                echo "### Generated Test Classes"
                echo "- LiqAPICreate${ENTITY_NAME}IntegrationTest"
                echo "- LiqAPIUpdate${ENTITY_NAME}IntegrationTest"
                echo "- LiqAPIQuery${ENTITY_NAME}IntegrationTest"
                echo "- LiqAPIDelete${ENTITY_NAME}IntegrationTest"
                echo ""
                echo "### Spreadsheet"
                echo "\`${FILE_PATH}\`"
                echo ""
                echo "---"
                echo "*Generated by lending-api-junit-generator agent*"
              } > /tmp/pr_body_rendered.txt

              echo "Creating pull request for ${ENTITY_NAME}..."
              gh pr create \
                --base develop \
                --head "${FEATURE_BRANCH}" \
                --title "feat: Add JUnit integration tests for ${ENTITY_NAME}" \
                --body-file /tmp/pr_body_rendered.txt \
                --label "auto-generated,junit,integration-tests" || echo "PR creation failed or PR already exists"
            else
              echo "No changes to commit for ${ENTITY_NAME}"
            fi

            # Return to develop for next entity
            git checkout develop

          done < /tmp/entities_to_process.txt

          # Cleanup
          rm -f /tmp/entities_to_process.txt /tmp/agent_prompt.txt /tmp/pr_body.txt /tmp/pr_body_rendered.txt

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin develop > /dev/null 2>&1; then
            git fetch origin develop
            git checkout develop
          else
            git checkout -b develop
            git push -u origin develop
          fi

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add "${REQ_DIR}"
          git commit -m "refactor: Mark requirement spreadsheets as processed (run ${{ github.run_id }})" --allow-empty

          git push origin HEAD:develop || echo "No changes to push"
          echo "Changes pushed successfully"
