name: Process Requirement Spreadsheets

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Directory that contains the requirement Excel files
  REQ_DIR: IntegrationAPITool/artifacts/requirement_doc

jobs:
  process-spreadsheets:
    name: Process requirement spreadsheets and generate JUnit tests
    runs-on: ubuntu-latest
    env:
      # Required by the 'gh' CLI for all GitHub API calls (PR creation, etc.)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── Checkout with full history so branch creation works correctly ────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install the 'xlsx' library used by every Node.js script in this workflow
      - name: Install Node.js dependencies
        run: npm install xlsx

      # Generate a timestamped feature branch name using Node.js and export it
      # to GITHUB_ENV so every subsequent step in this job can reference it
      # as the ${FEATURE_BRANCH} environment variable.
      # Format: develop/junits_YYYYMMDD_HHmmss  (UTC)
      - name: Generate timestamped feature branch name
        run: |
          node -e "
            const now  = new Date();
            const pad  = n => String(n).padStart(2, '0');
            const ts   = now.getUTCFullYear().toString()
                       + pad(now.getUTCMonth() + 1)
                       + pad(now.getUTCDate())
                       + '_'
                       + pad(now.getUTCHours())
                       + pad(now.getUTCMinutes())
                       + pad(now.getUTCSeconds());
            const branch = 'develop/junits_' + ts;
            // Write to GITHUB_ENV so the variable is available in all later steps
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'FEATURE_BRANCH=' + branch + '\n');
            console.log('Feature branch set to: ' + branch);
          "

      # ── STEPS 1-3 ────────────────────────────────────────────────────────────
      # Scan REQ_DIR for .xlsx files that do NOT carry a 'done_' prefix.
      # For every qualifying file, read ENTITY_NAME (Column A) and its
      # corresponding value (Column B) from each sheet row.
      # Results are written to /tmp/entities.json for downstream steps.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Read Excel files and extract entities
        run: |
          cat > extract_entities.mjs << 'SCRIPT_EOF'
          import { readFileSync, readdirSync, writeFileSync } from 'fs';
          import { join, basename } from 'path';
          import XLSX from 'xlsx';

          const reqDir = process.env.REQ_DIR;

          // STEP 1: List all .xlsx files in the requirement_doc directory.
          // STEP 2: Exclude any file already prefixed with 'done_'.
          const files = readdirSync(reqDir)
            .filter(name => name.endsWith('.xlsx') && !name.startsWith('done_'))
            .map(name => join(reqDir, name));

          if (files.length === 0) {
            console.log('No unprocessed spreadsheets found — nothing to do.');
            writeFileSync('/tmp/entities.json', JSON.stringify([]));
            process.exit(0);
          }

          console.log(`Found ${files.length} unprocessed spreadsheet(s):`);
          files.forEach(f => console.log(`  ${basename(f)}`));

          const results = [];

          // STEP 3: For each file, read every row and extract
          //         ENTITY_NAME (Column A) and its value (Column B).
          for (const filePath of files) {
            const workbook = XLSX.read(readFileSync(filePath), { type: 'buffer' });

            for (const sheetName of workbook.SheetNames) {
              // Parse as raw row arrays so column indices are explicit
              const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
                header: 1,
                defval: '',
              });

              for (const row of rows) {
                const entityName  = String(row[0] ?? '').trim(); // Column A — ENTITY_NAME
                const entityValue = String(row[1] ?? '').trim(); // Column B — corresponding value

                // Skip blank rows
                if (!entityName) continue;

                results.push({ filePath, entityName, entityValue });
                console.log(`  -> ${entityName} : ${entityValue}  [${basename(filePath)}]`);
              }
            }
          }

          // Persist extracted data so later steps can consume it
          writeFileSync('/tmp/entities.json', JSON.stringify(results, null, 2));
          console.log(`\nTotal entities extracted: ${results.length}`);
          SCRIPT_EOF

          node extract_entities.mjs

      # ── STEP 4 ───────────────────────────────────────────────────────────────
      # Create the timestamped 'develop/junits_<timestamp>' feature branch from
      # the default branch (main). If the branch already exists on the remote,
      # check it out instead. All generated JUnit classes and renamed spreadsheets
      # land on this single branch for the entire workflow run.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Create or checkout timestamped develop/junits feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if develop/junits already exists on the remote
          if git ls-remote --exit-code origin "${FEATURE_BRANCH}" > /dev/null 2>&1; then
            # Branch exists — fetch it and switch to it
            git fetch origin "${FEATURE_BRANCH}"
            git checkout "${FEATURE_BRANCH}"
            echo "Checked out existing branch: ${FEATURE_BRANCH}"
          else
            # Branch does not exist — create it from current HEAD (main)
            git checkout -b "${FEATURE_BRANCH}"
            git push -u origin "${FEATURE_BRANCH}"
            echo "Created new branch: ${FEATURE_BRANCH}"
          fi

      # ── STEPS 5-7 ────────────────────────────────────────────────────────────
      # For each entity extracted above:
      #   STEP 5 — Build the agent invocation prompt and log it to the
      #            GitHub Actions step summary (visible in the run UI).
      #            The lending-api-junit-generator agent reads this prompt
      #            to generate the JUnit classes on the develop/junits_<timestamp> branch.
      #   STEP 6 — After all entities from a given file are sent to the agent,
      #            rename that Excel file with the 'done_' prefix.
      #   STEP 7 — Move to the next Excel file and repeat until all are done.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Invoke agent per entity and rename processed Excel files
        run: |
          cat > process_entities.mjs << 'SCRIPT_EOF'
          import { readFileSync, renameSync, existsSync, appendFileSync } from 'fs';
          import { dirname, basename, join } from 'path';

          const entities = JSON.parse(readFileSync('/tmp/entities.json', 'utf8'));

          if (entities.length === 0) {
            console.log('No entities to process.');
            process.exit(0);
          }

          // Group entities by source file so each file is renamed exactly once,
          // only after all its entities have been sent to the agent.
          const byFile = {};
          for (const entry of entities) {
            (byFile[entry.filePath] ??= []).push(entry);
          }

          // Path to the GitHub Actions step summary file (set by the runner)
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          // STEP 7: Iterate over each unprocessed Excel file
          for (const [filePath, entityList] of Object.entries(byFile)) {
            console.log(`\nProcessing file: ${basename(filePath)}`);

            // STEP 5: For each entity in this file, build and log the agent prompt.
            // The prompt includes the entity name, its value, and the source Excel file path
            // so the agent has full context to locate the spreadsheet and generate tests.
            for (const { entityName, entityValue } of entityList) {
              // Construct the prompt for the lending-api-junit-generator agent.
              // The agent reads this to determine which JUnit classes to generate.
              const agentRef = '.github/agents/lending-api-junit-generator.agent.md';
              const prompt   = `#lending-api-junit-generator Business Object is '${entityName}' with value '${entityValue}'. Specification spreadsheet path: '${filePath}'.`;

              console.log(`  Entity  : ${entityName}`);
              console.log(`  Value   : ${entityValue}`);
              console.log(`  File    : ${filePath}`);
              console.log(`  Agent   : ${agentRef}`);
              console.log(`  Prompt  : ${prompt}`);

              // Append invocation details to the workflow step summary for full visibility
              if (summaryPath) {
                appendFileSync(summaryPath,
                  `### Agent Invocation — ${entityName}\n` +
                  `| Field | Value |\n|---|---|\n` +
                  `| **Entity** | \`${entityName}\` |\n` +
                  `| **Value** | \`${entityValue}\` |\n` +
                  `| **Spreadsheet** | \`${filePath}\` |\n` +
                  `| **Agent** | \`${agentRef}\` |\n` +
                  `| **Prompt** | \`${prompt}\` |\n\n`
                );
              }
            }

            // STEP 6: All entities from this file have been sent to the agent.
            //         Rename the file by prepending 'done_' to signal completion.
            const dir      = dirname(filePath);
            const filename = basename(filePath);
            const donePath = join(dir, `done_${filename}`);

            if (!existsSync(donePath)) {
              renameSync(filePath, donePath);
              console.log(`  Renamed: ${filename}  ->  done_${filename}`);
            } else {
              console.log(`  Already renamed: done_${filename}`);
            }
          }
          SCRIPT_EOF

          node process_entities.mjs

      # Stage and commit all renamed spreadsheets (done_ prefix) to the
      # develop/junits_<timestamp> feature branch
      - name: Commit and push renamed spreadsheets to develop/junits_<timestamp>
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all changes in REQ_DIR — covers the rename (old name removed, done_ name added)
          git add -A "${REQ_DIR}"

          if ! git diff --staged --quiet; then
            git commit -m "refactor: Mark requirement spreadsheets as processed (run ${{ github.run_id }})"
            git push origin "${FEATURE_BRANCH}"
            echo "Committed and pushed renamed spreadsheets to ${FEATURE_BRANCH}"
          else
            echo "No staged changes — nothing to commit"
          fi

      # ── STEP 8 ───────────────────────────────────────────────────────────────
      # Once all Excel files have been renamed to 'done_', raise a single PR
      # from the develop/junits_<timestamp> branch targeting the default branch (main).
      # If any unprocessed files remain the step warns and skips PR creation.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Create Pull Request from develop/junits_<timestamp> to main
        run: |
          # Safety check: ensure no unprocessed spreadsheets remain
          REMAINING=$(find "${REQ_DIR}" -maxdepth 1 -type f -name "*.xlsx" ! -name "done_*" | wc -l)
          if [ "${REMAINING}" -gt 0 ]; then
            echo "WARNING: ${REMAINING} unprocessed spreadsheet(s) still present — skipping PR creation."
            exit 0
          fi

          # Build the PR description body
          {
            echo "## Automated JUnit Generation"
            echo ""
            echo "This PR was raised automatically after all requirement spreadsheets"
            echo "in \`${REQ_DIR}\` were processed by the \`lending-api-junit-generator\` agent."
            echo ""
            echo "### What changed"
            echo "- Requirement spreadsheets renamed with \`done_\` prefix"
            echo "- JUnit 5 integration test classes generated for each entity"
            echo ""
            echo "---"
            echo "*Generated by the Process Requirement Spreadsheets workflow — run \`${{ github.run_id }}\`*"
          } > /tmp/pr_body.txt

          # Create the PR; if one already exists the command exits non-zero —
          # suppress that so the workflow step does not fail
          gh pr create \
            --base main \
            --head "${FEATURE_BRANCH}" \
            --title "feat: JUnit integration tests from requirement spreadsheets" \
            --body-file /tmp/pr_body.txt \
            --label "auto-generated,junit,integration-tests" \
            || echo "PR already exists or could not be created — continuing."
