name: LENDING API JUNIT GENERATOR

on:
  # Run automatically every 2 minutes.
  # Note: GitHub Actions enforces a minimum effective interval of ~5 minutes
  # for scheduled workflows despite what the cron expression says.
  schedule:
    - cron: '*/2 * * * *'
  # Keep manual trigger available for ad-hoc runs
  workflow_dispatch:

permissions:
  contents: read   # only needs read — no git pushes in this workflow
  issues: write    # needed to create and assign issues

env:
  # Directory that contains the requirement Excel files
  REQ_DIR: IntegrationAPITool/artifacts/requirement_doc

jobs:
  process-spreadsheets:
    name: Process requirement spreadsheets and create JUnit generator issues
    runs-on: ubuntu-latest
    env:
      # GITHUB_TOKEN is used for all gh CLI calls (list/create/assign issues)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── Checkout repository ──────────────────────────────────────────────────
      # Shallow clone is sufficient — we only need the Excel files.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install the 'xlsx' library used to read Excel files
      - name: Install Node.js dependencies
        run: npm install xlsx

      # ── Process each Excel file ──────────────────────────────────────────────
      # For each .xlsx file in REQ_DIR (processed sequentially):
      #
      #   STEP 2 — Find all .xlsx files in REQ_DIR.
      #   STEP 3 — Search GitHub Issues for a matching issue title.
      #   STEP 4 — Issue OPEN  → skip (agent is still working on it).
      #   STEP 5 — Issue CLOSED → skip (already fully processed).
      #   STEP 6 — No issue exists → read ENTITY_NAME (A2) and its value (B2)
      #            from the first qualifying worksheet.
      #   STEP 7 — Create a new GitHub Issue containing:
      #              • agent: Lending API JUnit Generator
      #              • ENTITY_NAME value (B2)
      #              • Excel file path
      #              • Agent invocation prompt
      #   STEP 8 — Assign the issue to 'copilot' to trigger the agent,
      #            then move on to the next file.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Process Excel files and create agent issues
        run: |
          # ── Node.js helper: read ENTITY_NAME (A2) and entity value (B2) ────────
          # Checks the first qualifying sheet (Create / Update / GetByID / Delete)
          # and prints shell-sourceable key=value output.
          cat > read_entity.mjs << 'SCRIPT_EOF'
          import { readFileSync } from 'fs';
          import XLSX from 'xlsx';

          const filePath = process.argv[2];
          if (!filePath) { process.stderr.write('No file path provided\n'); process.exit(1); }

          const TARGET_SHEETS = new Set(['create', 'update', 'getbyid', 'delete']);
          const workbook = XLSX.read(readFileSync(filePath), { type: 'buffer' });

          for (const sheetName of workbook.SheetNames) {
            const key = sheetName.trim().toLowerCase().replace(/\s+/g, '');
            if (!TARGET_SHEETS.has(key)) continue;

            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
              header: 1, defval: ''
            });

            // Row index 1 = spreadsheet row 2  (A2 / B2); row 0 is the header.
            if (rows.length < 2) continue;

            const entityName  = String(rows[1][0] ?? '').trim(); // Column A — A2
            const entityValue = String(rows[1][1] ?? '').trim(); // Column B — B2

            if (entityName && entityValue) {
              process.stdout.write('ENTITY_NAME=' + entityName + '\n');
              process.stdout.write('ENTITY_VALUE=' + entityValue + '\n');
              process.exit(0);
            }
          }

          process.stderr.write('No entity data found in A2/B2 of any target sheet.\n');
          process.exit(1);
          SCRIPT_EOF

          # ── Bail early if the requirement directory does not exist ──────────
          if [ ! -d "${REQ_DIR}" ]; then
            echo "REQ_DIR '${REQ_DIR}' not found — nothing to do."
            exit 0
          fi

          # ── STEP 2: Collect all .xlsx files ─────────────────────────────────
          mapfile -t FILES < <(find "${REQ_DIR}" -maxdepth 1 -type f -name "*.xlsx" | sort)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No Excel files found in ${REQ_DIR} — nothing to do."
            exit 0
          fi

          echo "Found ${#FILES[@]} Excel file(s):"
          printf '  %s\n' "${FILES[@]}"

          # ── Process each file ───────────────────────────────────────────────
          for FILE_PATH in "${FILES[@]}"; do
            FILENAME=$(basename "${FILE_PATH}")
            # Issue title used as a stable identifier for deduplication checks
            ISSUE_TITLE="JUnit Generator: ${FILENAME}"

            echo ""
            echo "------------------------------------------------------------"
            echo "File: ${FILENAME}"
            echo "------------------------------------------------------------"

            # ── STEP 3: Check for an existing issue for this file ────────────
            # Search all issues (open + closed) whose title matches exactly.
            EXISTING=$(gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --search "\"${ISSUE_TITLE}\" in:title" \
              --state all \
              --json number,state \
              --limit 5 2>/dev/null || echo "[]")

            OPEN_COUNT=$(echo "${EXISTING}" | \
              node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
                       console.log(JSON.parse(d).filter(i=>i.state==='OPEN').length)")

            CLOSED_COUNT=$(echo "${EXISTING}" | \
              node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
                       console.log(JSON.parse(d).filter(i=>i.state==='CLOSED').length)")

            # ── STEP 4: Issue is OPEN → agent is still working → skip ────────
            if [ "${OPEN_COUNT}" -gt 0 ]; then
              echo "  Issue already OPEN for '${FILENAME}' — skipping."
              continue
            fi

            # ── STEP 5: Issue is CLOSED → already processed → skip ───────────
            if [ "${CLOSED_COUNT}" -gt 0 ]; then
              echo "  Issue already CLOSED for '${FILENAME}' — skipping."
              continue
            fi

            # ── STEP 6: No issue exists → read ENTITY_NAME (A2) & value (B2) ─
            echo "  No existing issue. Reading entity data from spreadsheet..."

            ENTITY_DATA=$(node read_entity.mjs "${FILE_PATH}" 2>&1)
            if [ $? -ne 0 ]; then
              echo "  WARNING: Could not read entity data from '${FILENAME}': ${ENTITY_DATA}"
              continue
            fi

            # Parse the key=value output
            ENTITY_NAME=$(echo  "${ENTITY_DATA}" | grep '^ENTITY_NAME='  | cut -d= -f2-)
            ENTITY_VALUE=$(echo "${ENTITY_DATA}" | grep '^ENTITY_VALUE=' | cut -d= -f2-)

            if [ -z "${ENTITY_VALUE}" ]; then
              echo "  WARNING: ENTITY_VALUE (B2) is blank in '${FILENAME}' — skipping."
              continue
            fi

            echo "  ENTITY_NAME  (A2): ${ENTITY_NAME}"
            echo "  ENTITY_VALUE (B2): ${ENTITY_VALUE}"

            # ── STEP 7: Create a new GitHub Issue ────────────────────────────
            # The issue body contains:
            #   • The agent reference (Lending API JUnit Generator)
            #   • ENTITY_NAME value (B2) and the spreadsheet path
            #   • The agent invocation prompt
            ISSUE_BODY=$(printf '%s\n' \
              "agent: Lending API JUnit Generator" \
              "" \
              "**Entity name**: \`${ENTITY_VALUE}\`" \
              "**Specification spreadsheet**: \`${FILE_PATH}\`" \
              "" \
              "---" \
              "" \
              "\`#lending-delete-api-junit-generator Business Object is '${ENTITY_VALUE}'. [Specification spreadsheet path: '${FILE_PATH}']\`")

            # Use COPILOT_PAT to create the issue if available (required for
            # assigning to 'copilot'); fall back to GITHUB_TOKEN otherwise.
            if [ -n "${{ secrets.COPILOT_PAT }}" ]; then
              CREATE_TOKEN="${{ secrets.COPILOT_PAT }}"
            else
              CREATE_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            fi

            ISSUE_URL=$(GH_TOKEN="${CREATE_TOKEN}" gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${ISSUE_TITLE}" \
              --body "${ISSUE_BODY}" \
              --label "auto-generated,junit")
            ISSUE_NUMBER="${ISSUE_URL##*/}"

            echo "  Created issue #${ISSUE_NUMBER}: ${ISSUE_URL}"

            # ── STEP 8: Assign the issue to the Copilot agent ────────────────
            # Assigning to 'copilot' triggers the GitHub Copilot coding agent.
            # This requires a user PAT (COPILOT_PAT); GITHUB_TOKEN is rejected
            # for this specific operation. If COPILOT_PAT is not set the
            # assignment is skipped with a warning — the issue still exists and
            # can be assigned manually.
            if [ -n "${{ secrets.COPILOT_PAT }}" ]; then
              GH_TOKEN="${{ secrets.COPILOT_PAT }}" gh issue edit "${ISSUE_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --add-assignee "copilot" 2>/dev/null \
                && echo "  Assigned issue #${ISSUE_NUMBER} to GitHub Copilot agent." \
                || echo "  WARNING: Could not assign to 'copilot' (Copilot coding agent may not be enabled)."
            else
              echo "  WARNING: COPILOT_PAT not set — skipping Copilot agent assignment."
              echo "  Assign issue #${ISSUE_NUMBER} to 'copilot' manually to trigger the agent."
            fi

            # Move on to the next file immediately after triggering the agent.
            # The agent runs asynchronously — this workflow does not wait for it.
            echo "  Moving to next file."
          done

          echo ""
          echo "All files processed."
